name: Java Spring Boot CI

# 언제 이 로봇을 실행할 것인가?
on:
  pull_request:
    branches: [ "main", "develop" ] # main이나 develop 브라우저로 PR이 올 때만 실행

jobs:
  build:
    runs-on: ubuntu-latest # 깃허브가 빌려주는 가상 리눅스 컴퓨터 환경

    steps:
      - name: 1. 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Gradle 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 4. 스프링 부트 빌드 및 테스트 실행
        run: ./gradlew build
