spring.main.web-application-type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

app.ai-cli.system-prompt=${AZURE_OPENAI_SYSTEM_PROMPT:You are a concise prompt testing assistant for TroubleLog.}
app.ai-cli.user-prompt=${AZURE_OPENAI_TEST_PROMPT:}s

# 아래 값들은 프롬프트 파일만 따로 테스트하기 위한 샘플 입력입니다.
# DB에서 가져온 실제 데이터가 아닙니다.
# 실제 API 흐름에서는 ProjectSession.codeContent가 {codeContent} 자리에 주입됩니다.
app.ai-cli.code-content=${AZURE_OPENAI_TEST_CODE_CONTENT:public class LoginService { public boolean login(String email, String password) { if (email == null || password == null) { throw new IllegalArgumentException("required"); } return "test@example.com".equals(email) && "1234".equals(password); } }}
app.ai-cli.code-purpose=${AZURE_OPENAI_TEST_CODE_PURPOSE:이 코드는 이메일과 비밀번호를 입력받아 로그인 성공 여부를 판단하는 서비스 코드입니다.}
app.ai-cli.tech-rationale=${AZURE_OPENAI_TEST_TECH_RATIONALE:Spring Boot 서비스 계층에서 로그인 검증 책임을 분리하기 위해 작성했습니다.}
app.ai-cli.exception-handling=${AZURE_OPENAI_TEST_EXCEPTION_HANDLING:email 또는 password가 null이면 IllegalArgumentException을 발생시킵니다.}
app.ai-cli.project-scale=${AZURE_OPENAI_TEST_PROJECT_SCALE:개인 학습용 작은 백엔드 프로젝트입니다.}
